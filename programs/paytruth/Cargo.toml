[package]
name = "paytruth"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "paytruth"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.2.2"

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-pubkey = "4"
solana-instruction = "3"
solana-clock = "3"
solana-program-pack = "3"
solana-program-option = "3"
solana-instruction-error = "2"
solana-transaction-error = "3"
spl-token-interface = "2"
spl-token-2022-interface = "2.1"
spl-associated-token-account-interface = "2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
